name: Production Notifications Migration (ONE-TIME)

# THIS RUN's purpose: READ-ONLY final-activation readiness check for
# Notifications Campaigns. NO schema change, NO data mutation, NO test
# row created, NO transport .send() call ever made (constructing/type-
# checking a transport instance is not the same as sending -- this
# mirrors exactly what scripts/campaign_worker_runner.py's own
# _verify_production_transport() already does before claiming any real
# work). Never prints DATABASE_URL/credentials. Confirms:
#   1. the existing DRAFT campaign referencing the FIXED "sele" audience
#      (never substituted, never broadened -- just located and reported).
#   2. zero FROZEN/SENDING/SCHEDULED executions currently exist in
#      production (proves activating the new worker cron is a safe
#      no-op until the product owner actually approves something).
#   3. select_transport() resolves to the REAL FirebaseTransport class
#      under the EXACT production gate env the activated worker cron
#      will use (proves the 4-gate chain is genuinely satisfied in
#      production right now, not merely on paper).
#
# Temporary branch only, never main.

on:
  workflow_dispatch: {}

concurrency:
  group: production-diagnose-campaign-readiness
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this exact ref
        uses: actions/checkout@v4

      - name: Setup Python (matches production runtime.txt)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight -- confirm this is the intended production DB (name only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT current_database()")
                  name = cur.fetchone()[0]
          finally:
              conn.close()
          print(f"[preflight] current_database() = {name!r}")
          if name != "jyotishasha":
              raise SystemExit(f"[preflight] REFUSING: expected 'jyotishasha', got {name!r}.")
          print("[preflight] Confirmed production 'jyotishasha' database.")
          PY

      - name: 1. Locate the existing DRAFT campaign for the FIXED "sele" audience (READ-ONLY)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT id, name, audience_type, is_active FROM saved_audiences WHERE name = 'sele'")
                  audiences = cur.fetchall()
                  print(f"[audience] 'sele' saved_audiences row(s): {audiences}")

                  cur.execute("SELECT user_id FROM saved_audience_members WHERE saved_audience_id = ANY(%s)", ([a[0] for a in audiences],))
                  members = [m[0] for m in cur.fetchall()]
                  print(f"[audience] 'sele' member user_id(s): {members}")

                  cur.execute("""
                      SELECT id, title, state, saved_audience_id, revision, created_at
                      FROM notification_campaigns
                      WHERE saved_audience_id = ANY(%s)
                      ORDER BY created_at DESC
                  """, ([a[0] for a in audiences],))
                  campaigns = cur.fetchall()
                  print(f"[campaign] campaign(s) referencing 'sele': {campaigns}")
          finally:
              conn.close()
          PY

      - name: 2. Confirm zero FROZEN/SENDING/SCHEDULED executions exist right now (READ-ONLY)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT id, campaign_id, state, scheduled_for
                      FROM notification_campaign_executions
                      WHERE state IN ('FROZEN', 'SENDING', 'SCHEDULED')
                  """)
                  rows = cur.fetchall()
                  print(f"[executions] FROZEN/SENDING/SCHEDULED execution(s) right now: {rows}")
                  if rows:
                      print("[executions] WARNING: activating the worker cron will process/promote the above on its next tick.")
                  else:
                      print("[executions] Confirmed: none -- activating the worker cron is a safe no-op until an operator approves something.")
          finally:
              conn.close()
          PY

      - name: 3. Confirm select_transport() resolves to the REAL FirebaseTransport under production gates (READ-ONLY -- never calls .send())
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACTIVITY_EVENTS_ENVIRONMENT: production
          OPENAI_API_KEY: "sk-migration-only-unused"
          RAZORPAY_KEY_ID: "migration-only-unused"
          RAZORPAY_KEY_SECRET: "migration-only-unused"
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          DEPLOYMENT_ENVIRONMENT: production
          ADMIN_CAMPAIGN_SEND_ENABLED: "true"
          ADMIN_CAMPAIGN_WORKER_AUTHORIZED: "true"
        run: |
          python - <<'PY'
          from app import app
          from notifications.campaign_transport import select_transport
          from notifications.firebase_transport import FirebaseTransport

          with app.app_context():
              transport = select_transport()
              print(f"[transport] select_transport() resolved to: {type(transport).__name__}")
              if type(transport) is not FirebaseTransport:
                  raise SystemExit(f"[transport] NOT FirebaseTransport -- got {type(transport).__name__}. Activation is NOT ready.")
              print("[transport] Confirmed: FirebaseTransport -- production sending gates are genuinely satisfied. (No .send() call made -- this proves resolution only.)")
          PY
