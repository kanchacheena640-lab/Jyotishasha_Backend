name: Production Notifications Migration (ONE-TIME)

# Temporary, narrowly-scoped, workflow_dispatch-ONLY migration runner.
#
# THIS RUN's purpose (Saved Audience V2): bring the production database
# from c4d8f21a9e05 to b4e7f18a2c6d -- adds saved_audiences.audience_type
# (additive, server_default='dynamic', every existing row backfills
# unchanged), widens saved_audiences.criteria to nullable, adds two
# CHECK constraints tying audience_type/criteria together, and creates
# the new saved_audience_members table (FK'd both ways ON DELETE
# CASCADE, UNIQUE(saved_audience_id, user_id)) -- BEFORE backend commit
# 2cc1a25 is deployed, since that commit's Saved Audience V2 code
# depends on this schema existing. Deliberately run from a temporary
# branch (never from main), so this migration can happen strictly ahead
# of any backend code deploy. This workflow file's PATH is already
# registered as workflow_dispatch-able on the default branch from the
# prior production migration (run 34454746590, c4d8f21a9e05) -- GitHub
# executes whatever version of this file exists on the dispatched ref,
# so this run's content lives only on this temporary branch, never on
# main.
#
# This workflow NEVER sets DEPLOYMENT_ENVIRONMENT, ADMIN_CAMPAIGN_SEND_ENABLED,
# or ADMIN_CAMPAIGN_WORKER_AUTHORIZED -- even if some import path
# accidentally reached notifications/campaign_transport.py::select_transport(),
# every one of its four required gates would still be false/missing, so
# it could only ever return NoSendTransport. It never imports or calls
# scripts/campaign_worker_runner.py or notifications.campaign_worker at
# all. Only two Alembic-facing Flask CLI commands are ever invoked:
# `flask db current` (read-only) and `flask db upgrade` (the repository's
# own reviewed, committed migration files -- no db.create_all(), no
# manual DDL, nothing else) -- plus one final READ-ONLY information_schema
# query to structurally confirm the new column/table/constraints exist,
# never a data-mutating query, never a test row inserted.
#
# factory.py::create_app() itself was audited before writing this file:
# db.create_all() was removed there (U6A.1), init_firebase() degrades to
# a harmless warning when FCM_SERVICE_ACCOUNT_JSON is absent (never
# raises), and no scheduler/Celery/Redis import happens at app-import
# time -- so importing `app` here (required for any `flask db ...`
# command) has no side effect beyond registering SQLAlchemy, which does
# not itself open a connection or touch a table.

on:
  workflow_dispatch: {}

concurrency:
  group: production-audience-v2-migration
  cancel-in-progress: false

# The one revision production must already be on before this workflow
# may proceed to `db upgrade` -- confirmed via this session's own prior
# migration run (34454746590) having brought production to exactly
# c4d8f21a9e05, and no other migration/deploy having touched it since.
# If production reports anything else, the workflow fails closed here
# rather than guessing.
env:
  EXPECTED_STARTING_REVISION: c4d8f21a9e05
  EXPECTED_TARGET_REVISION: b4e7f18a2c6d

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this exact ref
        uses: actions/checkout@v4

      - name: Setup Python (matches production runtime.txt)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight -- positively confirm this is the intended production DB (name only, never host/URL/password)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg2
          url = os.environ["DATABASE_URL"]
          conn = psycopg2.connect(url)
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT current_database()")
                  name = cur.fetchone()[0]
          finally:
              conn.close()
          print(f"[preflight] current_database() = {name!r}")
          if name != "jyotishasha":
              raise SystemExit(
                  f"[preflight] REFUSING: expected database name 'jyotishasha', got {name!r}. "
                  "Never proceeding against an unexpected target."
              )
          print("[preflight] Confirmed: this is the intended production 'jyotishasha' database.")
          PY

      - name: Preflight -- confirm no pre-existing saved_audiences row already has a non-'dynamic'/NULL-incompatible shape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn.cursor() as cur:
                  # Every existing row must have non-NULL criteria (the
                  # table's OWN current NOT NULL constraint already
                  # guarantees this -- this is a defense-in-depth re-check,
                  # never trusted blindly) -- this is what lets the new
                  # CHECK constraint (audience_type='dynamic' iff criteria
                  # IS NOT NULL) apply cleanly to every row via the
                  # server_default='dynamic' backfill, with zero rows
                  # needing individual correction.
                  cur.execute("SELECT count(*) FROM saved_audiences WHERE criteria IS NULL")
                  null_criteria_rows = cur.fetchone()[0]
          finally:
              conn.close()
          print(f"[preflight] existing saved_audiences rows with NULL criteria: {null_criteria_rows}")
          if null_criteria_rows != 0:
              raise SystemExit(
                  "[preflight] REFUSING: existing NULL-criteria rows would not satisfy the new "
                  "CHECK constraint once audience_type backfills to 'dynamic'. Stopping before upgrade."
              )
          print("[preflight] Confirmed: every existing row will remain a valid DYNAMIC audience after backfill.")
          PY

