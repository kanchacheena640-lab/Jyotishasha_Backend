name: Production Notifications Migration (ONE-TIME)

# THIS RUN's purpose: READ-ONLY diagnosis of the "FIXED audience still
# shows/resolves as All Users" production bug report. NO schema change,
# NO `flask db upgrade`, NO data mutation, NO test row created -- every
# query below is a plain SELECT (or a call into the resolver's own
# read-only, `SET TRANSACTION READ ONLY` codepath). Never prints
# DATABASE_URL/credentials. Prints numeric users.id values only (no
# name/email/phone) for the specific rows needed to trace this report.
#
# Temporary branch only, never main. Reuses the same workflow file path
# already registered as workflow_dispatch-able on the default branch
# from the prior production migration runs -- GitHub executes whichever
# version of this file exists on the dispatched ref, so this diagnostic
# content lives only here.

on:
  workflow_dispatch: {}

concurrency:
  group: production-diagnose-fixed-audience
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this exact ref
        uses: actions/checkout@v4

      - name: Setup Python (matches production runtime.txt)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight -- confirm this is the intended production DB (name only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT current_database()")
                  name = cur.fetchone()[0]
          finally:
              conn.close()
          print(f"[preflight] current_database() = {name!r}")
          if name != "jyotishasha":
              raise SystemExit(f"[preflight] REFUSING: expected 'jyotishasha', got {name!r}.")
          print("[preflight] Confirmed production 'jyotishasha' database.")
          PY

      - name: Trace recent FIXED audiences (READ-ONLY raw SQL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT id, name, audience_type, criteria, is_active, created_at
                      FROM saved_audiences
                      WHERE audience_type = 'fixed'
                      ORDER BY created_at DESC
                      LIMIT 10
                  """)
                  rows = cur.fetchall()
                  print(f"[trace] {len(rows)} most recent FIXED saved_audiences row(s):")
                  for r in rows:
                      print(f"  id={r[0]} name={r[1]!r} audience_type={r[2]!r} criteria={r[3]!r} is_active={r[4]} created_at={r[5]}")

                  print()
                  for r in rows:
                      aid = r[0]
                      cur.execute("SELECT user_id FROM saved_audience_members WHERE saved_audience_id = %s ORDER BY user_id", (aid,))
                      members = [m[0] for m in cur.fetchall()]
                      print(f"[trace] audience id={aid}: {len(members)} saved_audience_members row(s), user_ids={members}")
          finally:
              conn.close()
          PY

