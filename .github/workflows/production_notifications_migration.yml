          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          ok = True
          try:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT column_name, is_nullable, column_default
                      FROM information_schema.columns
                      WHERE table_name = 'saved_audiences' AND column_name IN ('audience_type', 'criteria')
                      ORDER BY column_name
                  """)
                  cols = {r[0]: r for r in cur.fetchall()}
                  print(f"[verify] saved_audiences columns: {cols}")
                  ok &= 'audience_type' in cols and cols['audience_type'][1] == 'NO'
                  ok &= 'criteria' in cols and cols['criteria'][1] == 'YES'

                  cur.execute("""
                      SELECT count(*) FROM saved_audiences WHERE audience_type != 'dynamic'
                  """)
                  non_dynamic = cur.fetchone()[0]
                  print(f"[verify] existing rows NOT backfilled to 'dynamic': {non_dynamic}")
                  ok &= non_dynamic == 0

                  cur.execute("""
                      SELECT count(*) FROM saved_audiences WHERE audience_type = 'dynamic' AND criteria IS NULL
                  """)
                  dynamic_null_criteria = cur.fetchone()[0]
                  print(f"[verify] 'dynamic' rows with NULL criteria (should be 0): {dynamic_null_criteria}")
                  ok &= dynamic_null_criteria == 0

                  cur.execute("""
                      SELECT conname, contype FROM pg_constraint
                      WHERE conrelid = 'saved_audiences'::regclass
                        AND conname IN ('ck_saved_audiences_audience_type', 'ck_saved_audiences_criteria_matches_type')
                  """)
                  check_constraints = {r[0]: r[1] for r in cur.fetchall()}
                  print(f"[verify] saved_audiences CHECK constraints: {check_constraints}")
                  ok &= len(check_constraints) == 2

                  cur.execute("""
                      SELECT to_regclass('saved_audience_members') IS NOT NULL
                  """)
                  table_exists = cur.fetchone()[0]
                  print(f"[verify] saved_audience_members table exists: {table_exists}")
                  ok &= bool(table_exists)

                  cur.execute("""
                      SELECT count(*) FROM saved_audience_members
                  """)
                  member_row_count = cur.fetchone()[0]
                  print(f"[verify] saved_audience_members row count (expected 0 -- brand new table): {member_row_count}")
                  ok &= member_row_count == 0

                  cur.execute("""
                      SELECT conname, contype FROM pg_constraint
                      WHERE conrelid = 'saved_audience_members'::regclass
                  """)
                  member_constraints = cur.fetchall()
                  print(f"[verify] saved_audience_members constraints: {member_constraints}")
                  contypes = {c[1] for c in member_constraints}
                  ok &= 'f' in contypes  # at least one FOREIGN KEY
                  ok &= 'u' in contypes  # the UNIQUE(saved_audience_id, user_id) constraint

                  cur.execute("""
                      SELECT indexname FROM pg_indexes WHERE tablename = 'saved_audience_members'
                  """)
                  indexes = [r[0] for r in cur.fetchall()]
                  print(f"[verify] saved_audience_members indexes: {indexes}")
                  ok &= any('saved_audience_id' in i for i in indexes)
                  ok &= any('user_id' in i for i in indexes)
