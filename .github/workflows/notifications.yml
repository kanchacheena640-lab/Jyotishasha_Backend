name: Run Notification Cron

# Campaign C Render cutover (retires the P4.9 GitHub-hosted campaign-c-
# worker job that used to live here): Campaign C's automatic scheduling
# now runs exclusively on Render Cron (jyotishasha-campaign-c-worker,
# render.yaml, "7,22,37,52 * * * *" -- the identical cadence this file
# used to carry), proven in production (recovered an overdue SCHEDULED
# campaign, froze/attempted/accepted exactly 1 delivery, device
# received it, tapped through to the correct destination, Campaign +
# Execution both COMPLETED). This file is A/B-only again -- its own 3
# schedule entries (morning/evening/dismiss_panchang) and run-cron job
# below are completely unchanged by that cutover. Manual/emergency
# Campaign C dispatch remains exclusively in
# campaign_notifications_worker.yml's own workflow_dispatch (incl. the
# scoped --execution-id mode) -- unchanged, still the one manual entry
# point.

on:
  schedule:
    # 🕒 6:00 AM IST -> morning slot
    - cron: "30 0 * * *"
    # 🕒 5:00 PM IST -> Panchang dismiss slot
    - cron: "30 11 * * *"
    # 🕒 6:00 PM IST -> evening slot
    - cron: "30 12 * * *"

  workflow_dispatch:
    inputs:
      slot:
        description: "Notification slot to run (manual trigger only)"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - dismiss_panchang

jobs:
  run-cron:
    # This `if:` predates the Campaign C Render cutover -- it originally
    # excluded a 4th, Campaign-C-only schedule entry this file no longer
    # has (see the file-level comment above). Left exactly as-is
    # (byte-unchanged, unconditionally true now) rather than simplified,
    # so this job's own trigger behavior for the 3 real A/B slots and
    # workflow_dispatch is provably untouched by that cutover.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '7,22,37,52 * * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Notification Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          # N-FIX-1 -- db_safety.enforce_local_database_safety() (called
          # unconditionally at factory.py's own create_app()) requires
          # this to be explicitly "production" to allow startup against
          # the real DATABASE_URL secret above; GitHub Actions runners
          # have neither RENDER=true nor a local-allowlisted DB, so
          # without this every run here unconditionally raised
          # DatabaseSafetyError at boot. Same value
          # campaign_notifications_worker.yml already sets.
          ACTIVITY_EVENTS_ENVIRONMENT: production
          # GitHub Actions is the single source of truth for which slot is
          # running -- it knows which schedule entry fired (or which slot
          # a manual run requested), so the scheduler never has to guess
          # from the clock.
          NOTIFICATION_SLOT: ${{ (github.event.schedule == '30 0 * * *' && 'morning') || (github.event.schedule == '30 12 * * *' && 'evening') || (github.event.schedule == '30 11 * * *' && 'dismiss_panchang') || github.event.inputs.slot || 'skip' }}

        run: |
          python - <<EOF
          import os
          from factory import create_app
          from services.event_scheduler import run_daily_event_job, run_panchang_dismiss_job

          slot = os.getenv("NOTIFICATION_SLOT", "").strip().lower()

          app = create_app()

          with app.app_context():
              if slot == "dismiss_panchang":
                  run_panchang_dismiss_job()
              else:
                  run_daily_event_job()
          EOF
