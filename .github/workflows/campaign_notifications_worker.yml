name: Campaign C Notifications Worker

# P4 -- Final Production Activation: designed to run on BOTH a periodic
# schedule AND workflow_dispatch (workflow_dispatch retained for manual
# runs/debugging with custom bounds) -- the schedule trigger is
# TEMPORARILY PAUSED right now, see the P4.2 comment block below for
# why and how to restore it. Deliberately mirrors notifications.
# yml/alerts.yml's own proven shape (checkout -> setup-python -> pip
# install -> run one Python entrypoint inside create_app()'s
# app_context()) -- no new infrastructure category (no Celery, no
# Redis, no dedicated Render worker service), and this is the SAME
# convention notifications.yml (the automatic A/B event pipeline)
# already uses for its own, completely separate, unaffected cron slots.
#
# This workflow only ever calls scripts/campaign_worker_runner.py,
# which now (P4) ALSO calls
# notifications.campaign_scheduler.process_due_scheduled_campaigns()
# (the existing, already-tested N5 module -- see that script's own
# updated docstring) before its unchanged
# notifications.campaign_worker.process_execution() sweep, so ONE
# invocation both promotes any due SCHEDULED campaign and processes/
# sends whatever is FROZEN/SENDING (from Send Now OR from a just-
# promoted schedule) -- still the same single worker engine, never a
# second one.
#
# P4.1 (incident recovery) -- workflow_dispatch also accepts an optional
# execution_id input. When set, this ONE invocation processes exactly
# that one already-FROZEN/SENDING execution and nothing else in the
# backlog (no scheduler promotion, no other campaign's targets touched)
# -- see scripts/campaign_worker_runner.py's own docstring for why.
# Leave blank (the default) for ordinary whole-backlog operation.
#
# P4.2 (controlled first-production-send pause) -- the `schedule:`
# trigger below is TEMPORARILY DISABLED. Real production diagnostics
# during the first-ever real send found THREE simultaneously-FROZEN
# executions already sitting in the backlog, only ONE of which is
# currently product-owner-authorized to actually send. An automatic
# cron tick sweeping the WHOLE backlog (its normal, correct,
# already-tested behavior -- see the comment block this replaces)
# would attempt all three, including two that are not yet authorized.
# Rather than mutate/hide those rows or silently no-op inside the
# script, the trigger itself is paused here so nothing can fire
# unscoped while the first controlled production test is in progress.
# workflow_dispatch (including the --execution-id scoped mode above)
# remains fully available throughout this pause -- this is a trigger
# change only, no gate/transport/worker logic touched.
#
# RE-ENABLE once the one-user production acceptance criteria pass by
# uncommenting the block below (restoring `on:` to `schedule:` +
# `workflow_dispatch:` exactly as P4 first activated it) once every
# execution the operator does NOT want auto-processed has been
# resolved out of FROZEN/SENDING (sent deliberately via
# --execution-id, or explicitly deferred by the product owner):
#
#   schedule:
#     - cron: "*/15 * * * *"
#
# Every 15 minutes was the cadence when active: due-scheduled-campaign
# delivery lag bounded to at most ~15 minutes past the chosen send
# time -- a deliberately conservative, "smallest reliable" cadence for
# a human-scheduled, non-time-critical Admin campaign (not a
# high-frequency system), never tighter than actually needed. Bounded,
# single-pass invocation unchanged either way: processes at most
# --max-executions FROZEN/SENDING executions, at most --batch-limit
# deliveries each, within --max-runtime-seconds -- then exits. The
# EXISTING kill switch (ADMIN_CAMPAIGN_SEND_ENABLED, now a GitHub
# Actions repository VARIABLE -- see P4.4 below -- set to false)
# still independently stops both schedule promotion and delivery even
# once the schedule trigger is restored.
#
# P4.4 (operational hardening) -- ADMIN_CAMPAIGN_SEND_ENABLED below is
# now sourced from the GitHub Actions repository variable of the same
# name (${{ vars.ADMIN_CAMPAIGN_SEND_ENABLED }}), not a hardcoded
# literal -- flipping it is an immediate, code-free operational
# action (gh variable set / the Settings UI), taking effect on the
# very next run. See that env line's own comment for the full
# fail-closed reasoning.

on:
  workflow_dispatch:
    inputs:
      max_executions:
        description: "Maximum executions to claim this run"
        required: false
        default: "20"
        type: string
      batch_limit:
        description: "Maximum deliveries per execution this run"
        required: false
        default: "100"
        type: string
      max_runtime_seconds:
        description: "Wall-clock budget (seconds) before no new execution is claimed"
        required: false
        default: "240"
        type: string
      execution_id:
        description: "OPTIONAL incident recovery: process ONLY this one execution id (must be FROZEN/SENDING). Leave blank for normal whole-backlog operation."
        required: false
        default: ""
        type: string

# Prevents two invocations from ever running concurrently -- pure belt-
# and-suspenders on top of the DB's own FOR UPDATE SKIP LOCKED claim
# (which already makes a duplicate delivery structurally impossible),
# so we never pay for two runs racing over the same discovered backlog.
concurrency:
  group: campaign-notifications-worker
  cancel-in-progress: false

jobs:
  run-campaign-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Campaign C Worker (bounded, production gates required)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          # The one general-purpose environment marker db_safety.py
          # already defines/reuses (see that module's own docstring) --
          # set here so a real production DATABASE_URL is not mistaken
          # for an unmarked local run. Orthogonal to DEPLOYMENT_ENVIRONMENT
          # below, which gates the TRANSPORT decision, not the DB one.
          ACTIVITY_EVENTS_ENVIRONMENT: production
          # Campaign C production sending gates -- all four required
          # together by notifications/campaign_transport.py::select_transport().
          DEPLOYMENT_ENVIRONMENT: production
          # P4.4 (operational hardening) -- THE emergency kill switch is now
          # a GitHub Actions repository VARIABLE (not a secret -- it is a
          # plain boolean flag, never sensitive), not a hardcoded literal.
          # Flipping it (gh variable set ADMIN_CAMPAIGN_SEND_ENABLED --body
          # false, or the Settings -> Secrets and variables -> Actions ->
          # Variables UI) takes effect on the very next run -- schedule tick
          # or workflow_dispatch -- with NO commit/PR/deploy of any kind.
          # Absence of the variable evaluates to an empty string, which
          # _env_true() in scripts/campaign_worker_runner.py treats as
          # false -- fails CLOSED, exactly like every other gate here, never
          # fails open. DEPLOYMENT_ENVIRONMENT and ADMIN_CAMPAIGN_WORKER_
          # AUTHORIZED deliberately stay hardcoded literals, not variables:
          # they are identity/authorization gates for THIS workflow file
          # existing and running at all, not an operator's emergency stop --
          # exactly the two gates that must never be flipped by anything
          # other than a reviewed code change -- widening what's remotely
          # toggleable here would weaken, not harden, this design.
          ADMIN_CAMPAIGN_SEND_ENABLED: ${{ vars.ADMIN_CAMPAIGN_SEND_ENABLED }}
          ADMIN_CAMPAIGN_WORKER_AUTHORIZED: "true"
          # Deliberately NEVER set here:
          #   ADMIN_CAMPAIGN_TEST_TRANSPORT_ENABLED
          #   ADMIN_CAMPAIGN_TEST_RECIPIENT_APP_USER_ID
          # scripts/campaign_worker_runner.py's own preflight check fails
          # the whole run closed if either is ever present.
        run: |
          python scripts/campaign_worker_runner.py \
            --max-executions "${{ inputs.max_executions || '20' }}" \
            --batch-limit "${{ inputs.batch_limit || '100' }}" \
            --max-runtime-seconds "${{ inputs.max_runtime_seconds || '240' }}" \
            --execution-id "${{ inputs.execution_id || '' }}"
