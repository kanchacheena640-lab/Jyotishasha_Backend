name: Campaign C Notifications Worker

# P4.8 -- Render Cron was rejected (no paid/new infrastructure; GitHub
# stays the sole production automatic owner, matching every other
# notification pipeline in this repo). Root-cause audit of P4.7's own
# two failed schedule activations, compared against EVERY other
# scheduled workflow in this repo:
#
#   OBSERVATIONS (directly verified via the GitHub Actions API/git log,
#   not assumed):
#   - This workflow's `schedule:` trigger existed on origin/main for
#     two separate, real windows (~74 min/5 due ticks; ~63 min/3 due
#     ticks -- 8 due ticks total) and produced ZERO event="schedule"
#     runs in either window (workflow id 354738496 -- total_count of
#     schedule-triggered runs: 0, ever).
#   - Every other scheduled workflow in this repo (notifications.yml,
#     alerts.yml, subscription_state_sync.yml, update_ekadashi.yml)
#     reliably produces event="schedule" runs -- confirmed via their
#     own run histories, including runs that later FAILED for
#     unrelated business reasons but still genuinely FIRED on schedule.
#     This rules out a repo-wide Actions outage or an account/org-level
#     restriction (Actions permissions confirmed "all actions allowed";
#     no restrictive workflow-permissions setting).
#   - This workflow's cron (`*/15 * * * *`) was the ONLY high-frequency
#     (every-15-minutes) schedule in this entire repository -- every
#     other workflow's cron fires once daily or once yearly. It was
#     also the only cron aligned to the most popular minute-of-hour
#     boundaries (:00/:15/:30/:45).
#   - This workflow was the ONLY one of the compared set carrying a
#     `concurrency:` block.
#   - GitHub's own documentation states the schedule event "can be
#     delayed during periods of high loads... High load times include
#     the start of every hour," and recommends scheduling away from
#     popular boundary times to reduce delay likelihood.
#
#   CONCLUSION: ROOT CAUSE NOT FULLY PROVEN -- no access to GitHub's
#   internal scheduler telemetry exists to confirm the exact mechanism
#   with certainty. The strongest, most concrete, evidence-consistent
#   candidate is that this workflow's specific combination of very high
#   frequency + exact alignment with the most contested cron boundaries
#   made its ticks disproportionately likely to be silently dropped
#   under GitHub's own documented best-effort scheduling -- not a bug
#   in this repo's Actions configuration, permissions, or workflow
#   file structure, all of which were checked and found identical/non-
#   restrictive versus every reliably-firing sibling. A secondary,
#   also-unproven possibility: a newly-(re)enabled schedule may need
#   longer continuous dwell time than the ~1-1.25 hours each prior
#   attempt allowed before GitHub begins honoring it.
#
#   FIX (the smallest change addressing both candidates, without
#   touching worker/gate/transport logic or merging into another
#   pipeline): the cron below is now offset from every popular boundary
#   (":07/:22/:37/:52" instead of ":00/:15/:30/:45"), still exactly
#   every 15 minutes -- the <=15-minute processing target is unchanged.
#   The `concurrency:` block is removed -- it provided no safety value
#   beyond what the DB's own FOR UPDATE SKIP LOCKED delivery claim
#   already, independently guarantees (see process_execution() in
#   notifications/campaign_worker.py -- unchanged, still the actual
#   mechanism preventing a duplicate delivery even if two invocations,
#   from any source, ever somehow overlapped), and it was the one
#   other structural difference versus every reliable sibling, none of
#   which use it. This workflow is left in place CONTINUOUSLY this
#   time (not toggled off again after a short window) so a longer
#   dwell-time effect, if real, has a genuine chance to be observed.
#
# History below (P4 through P4.7) is retained for context on how this
# workflow reached its current shape -- none of it is stale
# instruction, only record. Deliberately mirrors notifications.
# yml/alerts.yml's own proven shape (checkout -> setup-python -> pip
# install -> run one Python entrypoint inside create_app()'s
# app_context()) -- no new infrastructure category (no Celery, no
# Redis, no dedicated Render worker service), and this is the SAME
# convention notifications.yml (the automatic A/B event pipeline)
# already uses for its own, completely separate, unaffected cron slots.
#
# This workflow only ever calls scripts/campaign_worker_runner.py,
# which now (P4) ALSO calls
# notifications.campaign_scheduler.process_due_scheduled_campaigns()
# (the existing, already-tested N5 module -- see that script's own
# updated docstring) before its unchanged
# notifications.campaign_worker.process_execution() sweep, so ONE
# invocation both promotes any due SCHEDULED campaign and processes/
# sends whatever is FROZEN/SENDING (from Send Now OR from a just-
# promoted schedule) -- still the same single worker engine, never a
# second one.
#
# P4.1 (incident recovery) -- workflow_dispatch also accepts an optional
# execution_id input. When set, this ONE invocation processes exactly
# that one already-FROZEN/SENDING execution and nothing else in the
# backlog (no scheduler promotion, no other campaign's targets touched)
# -- see scripts/campaign_worker_runner.py's own docstring for why.
# Leave blank (the default) for ordinary whole-backlog operation.
#
# P4.2 (controlled first-production-send pause, RESOLVED by P4.6) --
# the `schedule:` trigger was disabled here for a time. Real production
# diagnostics during the first-ever real send found THREE
# simultaneously-FROZEN executions in the backlog, only ONE of which
# was product-owner-authorized to send. An automatic cron tick sweeping
# the WHOLE backlog (its normal, correct, always-tested behavior) would
# have attempted all three, including two not yet authorized. Rather
# than mutate/hide those rows or silently no-op inside the script, the
# trigger itself was paused so nothing could fire unscoped while the
# first controlled production test was in progress. workflow_dispatch
# (including the --execution-id scoped mode above) remained fully
# available throughout the pause -- always a trigger change only, never
# a gate/transport/worker logic change.
#
# (Historical -- describes the cadence while GitHub's own `schedule`
# trigger was this workflow's automatic owner, P4 through P4.6; see
# P4.7 above for why that stopped being true. Render Cron's own
# schedule is configured on Render's side, not in this file, and is
# documented in this repo's own deployment notes / the P4.7 activation
# report, not here.) Every 15 minutes: due-scheduled-campaign delivery
# lag was bounded to at most ~15 minutes past the chosen send time --
# a deliberately conservative, "smallest reliable" cadence for a
# human-scheduled, non-time-critical Admin campaign (not a
# high-frequency system), never tighter than actually needed. Bounded,
# single-pass invocation, still true regardless of trigger source:
# processes at most --max-executions FROZEN/SENDING executions, at most
# --batch-limit deliveries each, within --max-runtime-seconds -- then
# exits. A larger backlog is picked up by the NEXT scheduled run, never
# drained in one unbounded pass. The EXISTING kill switch
# (ADMIN_CAMPAIGN_SEND_ENABLED, now a GitHub Actions repository
# VARIABLE -- see P4.4 below -- set to false) independently stops both
# schedule promotion and delivery on the very next tick -- turning the
# cron trigger off entirely is never required for an emergency stop.
#
# P4.6 (re-activation) -- the pause is lifted: the 2 unauthorized
# FROZEN executions were cancelled via the new P4.5
# _cancel_unsent_frozen() capability (zero transport attempts, nothing
# sent), and the whole notification_campaign_executions table was
# independently reconfirmed FROZEN=0/SENDING=0 immediately before this
# schedule trigger was restored. If the backlog is ever unsafe again
# for a similar reason, the SAME pause pattern (comment out the
# schedule: block, keep workflow_dispatch) is the smallest, already-
# proven way to stop new automatic sweeps without touching gate/
# transport/worker code.
#
# P4.4 (operational hardening) -- ADMIN_CAMPAIGN_SEND_ENABLED below is
# now sourced from the GitHub Actions repository variable of the same
# name (${{ vars.ADMIN_CAMPAIGN_SEND_ENABLED }}), not a hardcoded
# literal -- flipping it is an immediate, code-free operational
# action (gh variable set / the Settings UI), taking effect on the
# very next run. See that env line's own comment for the full
# fail-closed reasoning.

on:
  schedule:
    # P4.8 -- offset from every popular minute-of-hour boundary
    # (:00/:15/:30/:45), still exactly every 15 minutes. See the P4.8
    # comment block above for why.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      max_executions:
        description: "Maximum executions to claim this run"
        required: false
        default: "20"
        type: string
      batch_limit:
        description: "Maximum deliveries per execution this run"
        required: false
        default: "100"
        type: string
      max_runtime_seconds:
        description: "Wall-clock budget (seconds) before no new execution is claimed"
        required: false
        default: "240"
        type: string
      execution_id:
        description: "OPTIONAL incident recovery: process ONLY this one execution id (must be FROZEN/SENDING). Leave blank for normal whole-backlog operation."
        required: false
        default: ""
        type: string

jobs:
  run-campaign-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Campaign C Worker (bounded, production gates required)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          # The one general-purpose environment marker db_safety.py
          # already defines/reuses (see that module's own docstring) --
          # set here so a real production DATABASE_URL is not mistaken
          # for an unmarked local run. Orthogonal to DEPLOYMENT_ENVIRONMENT
          # below, which gates the TRANSPORT decision, not the DB one.
          ACTIVITY_EVENTS_ENVIRONMENT: production
          # Campaign C production sending gates -- all four required
          # together by notifications/campaign_transport.py::select_transport().
          DEPLOYMENT_ENVIRONMENT: production
          # P4.4 (operational hardening) -- THE emergency kill switch is now
          # a GitHub Actions repository VARIABLE (not a secret -- it is a
          # plain boolean flag, never sensitive), not a hardcoded literal.
          # Flipping it (gh variable set ADMIN_CAMPAIGN_SEND_ENABLED --body
          # false, or the Settings -> Secrets and variables -> Actions ->
          # Variables UI) takes effect on the very next run -- schedule tick
          # or workflow_dispatch -- with NO commit/PR/deploy of any kind.
          # Absence of the variable evaluates to an empty string, which
          # _env_true() in scripts/campaign_worker_runner.py treats as
          # false -- fails CLOSED, exactly like every other gate here, never
          # fails open. DEPLOYMENT_ENVIRONMENT and ADMIN_CAMPAIGN_WORKER_
          # AUTHORIZED deliberately stay hardcoded literals, not variables:
          # they are identity/authorization gates for THIS workflow file
          # existing and running at all, not an operator's emergency stop --
          # exactly the two gates that must never be flipped by anything
          # other than a reviewed code change -- widening what's remotely
          # toggleable here would weaken, not harden, this design.
          ADMIN_CAMPAIGN_SEND_ENABLED: ${{ vars.ADMIN_CAMPAIGN_SEND_ENABLED }}
          ADMIN_CAMPAIGN_WORKER_AUTHORIZED: "true"
          # Deliberately NEVER set here:
          #   ADMIN_CAMPAIGN_TEST_TRANSPORT_ENABLED
          #   ADMIN_CAMPAIGN_TEST_RECIPIENT_APP_USER_ID
          # scripts/campaign_worker_runner.py's own preflight check fails
          # the whole run closed if either is ever present.
        run: |
          python scripts/campaign_worker_runner.py \
            --max-executions "${{ inputs.max_executions || '20' }}" \
            --batch-limit "${{ inputs.batch_limit || '100' }}" \
            --max-runtime-seconds "${{ inputs.max_runtime_seconds || '240' }}" \
            --execution-id "${{ inputs.execution_id || '' }}"
